model: yolo11n-seg.pt
data: datasets/kolektorsdd2_yolo_seg_formal/data.yaml
project: runs/train
name: r4_seed42

train:
  epochs: 50
  imgsz: 640
  batch: 11
  workers: 0
  patience: 15
  optimizer: AdamW
  lr0: 0.002
  lrf: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.0
  nbs: 64
  seed: 42
  deterministic: true
  amp: true
  mosaic: 1.0
  close_mosaic: 10
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  fliplr: 0.5
  flipud: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  overlap_mask: true
  mask_ratio: 4
  fraction: 1.0
  save_period: -1

operating_point:
  confidence: 0.0975
  nms_iou: 0.3
  match_iou: 0.5
